spring:
  application:
    name: nearu-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:nearu}
    username: ${POSTGRES_USER:nearu}
    password: ${POSTGRES_PASSWORD:nearu}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # Supabase Auth public keys (not a secret).
          jwk-set-uri: ${SUPABASE_JWKS_URL:https://sdaquhofdlrodktfrzga.supabase.co/auth/v1/.well-known/jwks.json}
          jws-algorithms: ES256,RS256

management:
  endpoints:
    web:
      exposure:
        include: health
