<!-- Supabase > Authentication > Emails > Templates > « Confirm signup »
     Sujet conseillé : Confirmez votre compte NearU -->
<div style="font-family:Arial,sans-serif;max-width:520px;margin:0 auto;color:#0b2343">
  <h1 style="font-size:22px;margin:0 0 12px">Bienvenue sur <span style="color:#ff7417">nearU</span></h1>
  <p style="font-size:14px;line-height:1.6;color:#3d4859">
    Merci pour votre inscription. Cliquez sur le bouton ci-dessous pour confirmer votre adresse
    e-mail et activer votre compte.
  </p>
  <p style="margin:24px 0">
    <a href="{{ .ConfirmationURL }}"
       style="background:#0b2343;color:#fff;padding:12px 22px;border-radius:999px;text-decoration:none;font-weight:bold;font-size:14px">
      Confirmer mon adresse e-mail
    </a>
  </p>
  <p style="font-size:12px;color:#6b778a">
    Si vous n'êtes pas à l'origine de cette inscription, ignorez simplement cet e-mail.
  </p>
</div>
