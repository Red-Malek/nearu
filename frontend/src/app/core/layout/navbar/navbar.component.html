<header class="site-header section-wrap">
  <app-logo />
  <nav class="main-nav" aria-label="Navigation principale">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Accueil</a>
    <a routerLink="/" fragment="how-it-works">Comment ça marche</a>
    <a routerLink="/" fragment="about">À propos</a>
    <a routerLink="/" fragment="providers">Prestataires</a>
    <a routerLink="/" fragment="contact">Contact</a>
  </nav>
  @if (auth.me(); as me) {
    <a class="button button-dark header-cta" [routerLink]="auth.spacePath(me.role)">Mon espace <span>↗</span></a>
  } @else {
    <a class="button button-dark header-cta" routerLink="/connexion">Connexion <span>↗</span></a>
  }
</header>
