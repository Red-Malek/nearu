<header class="site-header section-wrap">
  <app-logo />
  <nav class="main-nav" aria-label="Navigation principale">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Accueil</a>
    <a routerLink="/" fragment="how-it-works">Comment ça marche</a>
    <a routerLink="/" fragment="about">À propos</a>
    <a routerLink="/" fragment="providers">Prestataires</a>
    <a routerLink="/" fragment="contact">Contact</a>
  </nav>
  @if (auth.currentUser(); as user) {
    <div class="account">
      <span class="account-name" [title]="user.fullName">
        <span class="initials" aria-hidden="true">{{ initials(user.fullName) }}</span>
        {{ user.fullName }}
      </span>
      <button type="button" class="button button-dark header-cta" (click)="logout()">Déconnexion</button>
    </div>
  } @else {
    <a class="button button-dark header-cta" routerLink="/login">Connexion <span>↗</span></a>
  }
</header>
