<div class="page-container">
    <main class="account-content">

        <section class="profile-card">

            <h2>Profil</h2>
            <p class="breadcrumb">Ces informations vous identifient auprès des professionnels que vous contactez</p>
            <div class="profile-header">

                <div class="profile-avatar">
                    @if (profile.profileImage()) {
                        <img [src]="profile.profileImage()" alt="Photo de profil">
                    } @else {
                        {{ initials }}
                    }
                </div>

                <div class="profile-info">
                    <h3>{{ firstName }} {{ lastName }}</h3>
                    <p>Utilisateur NearU</p>
                </div>

                <div class="photo-action">
                    <input
                        type="file"
                        id="profilePhoto"
                        accept="image/*"
                        (change)="onImageSelected($event)"
                    >

                    <label for="profilePhoto">
                        Changer la photo
                    </label>
                </div>

            </div>
            <div class="profile-form">

                <div class="form-row">

                    <div class="form-group">
                        <label for="firstName">Prénom</label>
                        <input
                            type="text"
                            id="firstName"
                            [(ngModel)]="firstName"
                            (ngModelChange)="updateInitials()"
                            [disabled]="loading"
                        >
                    </div>

                    <div class="form-group">
                        <label for="lastName">Nom</label>
                        <input
                            type="text"
                            id="lastName"
                            [(ngModel)]="lastName"
                            (ngModelChange)="updateInitials()"
                            [disabled]="loading"
                        >
                    </div>

                </div>

                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input
                        type="email"
                        id="email"
                        [(ngModel)]="email"
                        readonly
                    >
                </div>

                <div class="form-group">
                    <label for="phone">Téléphone</label>
                    <input
                        type="tel"
                        id="phone"
                        placeholder="+216 XX XXX XXX"
                        [(ngModel)]="phone"
                        [disabled]="loading"
                    >
                </div>

                @if (errorMessage) {
                    <p style="color:#c0392b">{{ errorMessage }}</p>
                }
                @if (successMessage) {
                    <p style="color:#0a7a3b">{{ successMessage }}</p>
                }

                <button
                    type="button"
                    class="save-button"
                    (click)="saveProfile()"
                    [disabled]="loading || saving"
                >
                    {{ saving ? 'Enregistrement…' : 'Enregistrer les modifications' }}
                </button>

            </div>

        </section>

    </main>

</div>
