<div class="dashboard-container">

  <!-- En-tête commun -->
  <div class="dashboard-header">
    <div>
      <p class="breadcrumb">Mon commerce / Tableau de bord</p>
      <h1>Tableau de <span>bord</span></h1>
      <p class="dashboard-description">
        Suivez vos vues, messages et performances auprès des habitants près de chez vous.
      </p>
    </div>

    <div class="visibility-badge">
      <span class="green-dot"></span>
      Fiche visible dans les recherches
    </div>
  </div>

  <!-- Contenu du dashboard -->
  <div class="dashboard-content">

    <aside class="dashboard-sidebar">
      <a routerLink="/merchant-dashboard"
         routerLinkActive="active"
         [routerLinkActiveOptions]="{ exact: true }">
        Vue d'ensemble
      </a>

      <a routerLink="/merchant-dashboard/requests"
         routerLinkActive="active">
        Demandes
      </a>

      <a routerLink="/merchant-dashboard/statistics"
         routerLinkActive="active">
        Statistiques
      </a>
    </aside>

    <!-- Le contenu des pages apparaîtra ici -->
    <main class="dashboard-main">
      <router-outlet></router-outlet>
    </main>

  </div>

</div>
